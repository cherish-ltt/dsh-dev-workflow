name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
        with:
          # 版本说明校验要读 git 历史（tag 与 commit 区间），浅克隆会失败
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Syntax check
        run: for f in lib/*.js test/*.mjs; do node --check "$f"; done
      - name: Test
        run: npm test
